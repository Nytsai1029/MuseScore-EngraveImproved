name: 'Check: EngraveImproved fork changes'

on:
  pull_request:
    paths:
      - '.github/workflows/check_engrave_improved.yml'
      - 'src/appshell/**'
      - 'src/engraving/**'
      - 'src/framework/cloud/**'
      - 'src/notation/**'
      - 'src/project/**'
      - 'src/webbridge/**'
  workflow_dispatch:

jobs:
  fork_delta_guards:
    name: Guard fork-specific behavior
    runs-on: ubuntu-22.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v6

    - name: Verify MSDZ save/open behavior is wired
      shell: bash
      run: |
        set -euo pipefail

        require_line() {
          local needle="$1"
          local file="$2"
          if ! grep -Fq "$needle" "$file"; then
            echo "::error file=${file}::Missing expected fork behavior: ${needle}"
            exit 1
          fi
        }

        require_line 'static const std::string MSDZ = "msdz";' src/engraving/infrastructure/mscio.h
        require_line 'suffix == MSDZ || suffix == MSCZ' src/engraving/infrastructure/mscio.h
        require_line 'writers->reg({ "msdz" }' src/notation/notationmodule.cpp
        require_line 'DEFAULT_FILE_SUFFIX(".msdz")' src/project/internal/projectconfiguration.cpp
        require_line 'DEFAULT_FILE_FILTER("*.msdz")' src/project/internal/projectconfiguration.cpp
        require_line 'Save as .msdz' src/project/internal/projectactionscontroller.cpp
        require_line 'This version saves MuseScore files with the .msdz extension.' src/project/internal/projectactionscontroller.cpp
        require_line 'MuseScore files") + " (*.msdz *.mscz)' src/project/internal/projectactionscontroller.cpp
        require_line 'MuseScore file") + " (*.msdz)' src/project/internal/opensaveprojectscenario.cpp
        require_line 'suffix != engraving::MSDZ' src/project/internal/notationproject.cpp
        require_line 'suffix != engraving::MSDZ' src/project/view/recentscoresmodel.cpp
        require_line '{ "*.msdz", "*.mscz", "*.mscx" }' src/project/internal/templatesrepository.cpp
        require_line 'MuseScore file") + " (*.msdz *.mscz)' src/appshell/view/preferences/generalpreferencesmodel.cpp
        require_line 'current.msdz' src/webbridge/webapi.cpp
        require_line 'temp_%1.msdz' src/framework/cloud/musescorecom/musescorecomservice.cpp

    - name: Verify key signature spacing controls are wired
      shell: bash
      run: |
        set -euo pipefail

        require_line() {
          local needle="$1"
          local file="$2"
          if ! grep -Fq "$needle" "$file"; then
            echo "::error file=${file}::Missing expected fork behavior: ${needle}"
            exit 1
          fi
        }

        require_line 'keysigSharpAccidentalDistance' src/engraving/style/styledef.h
        require_line 'keysigFlatAccidentalDistance' src/engraving/style/styledef.h
        require_line 'keysigSharpAccidentalDistance,              Spatium(0.3)' src/engraving/style/styledef.cpp
        require_line 'keysigFlatAccidentalDistance,               Spatium(0.3)' src/engraving/style/styledef.cpp
        require_line 'set(Sid::keysigSharpAccidentalDistance, val);' src/engraving/style/style.cpp
        require_line 'set(Sid::keysigFlatAccidentalDistance, val);' src/engraving/style/style.cpp
        require_line 'Sid::keysigSharpAccidentalDistance' src/engraving/rendering/score/tlayout.cpp
        require_line 'Sid::keysigFlatAccidentalDistance' src/engraving/rendering/score/tlayout.cpp
        require_line 'Sid::keysigNaturalDistance' src/engraving/rendering/score/tlayout.cpp
        require_line 'Sid::keysigSharpAccidentalDistance' src/engraving/rendering/single/singlelayout.cpp
        require_line 'Sid::keysigFlatAccidentalDistance' src/engraving/rendering/single/singlelayout.cpp
        require_line 'StyleId::keysigSharpAccidentalDistance' src/notation/view/styledialog/accidentalspagemodel.cpp
        require_line 'StyleId::keysigFlatAccidentalDistance' src/notation/view/styledialog/accidentalspagemodel.cpp
        require_line 'keySigSharpAccidentalDistance' src/notation/qml/MuseScore/NotationScene/internal/EditStyle/AccidentalsPage.qml
        require_line 'keySigFlatAccidentalDistance' src/notation/qml/MuseScore/NotationScene/internal/EditStyle/AccidentalsPage.qml
        require_line 'Distance between sharps:' src/notation/qml/MuseScore/NotationScene/internal/EditStyle/AccidentalsPage.qml
        require_line 'Distance between flats:' src/notation/qml/MuseScore/NotationScene/internal/EditStyle/AccidentalsPage.qml
